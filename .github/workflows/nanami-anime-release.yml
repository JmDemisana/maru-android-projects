name: Nanami Anime Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. nanami-anime-v2.1.0)"
        required: true
        default: "nanami-anime-v2.1.0"
  push:
    tags:
      - "nanami-anime-v*"
      - "!*rotator*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK" -name sdkmanager -type f | head -n 1)"
          echo "Using SDK at $SDK"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.1.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME="${TAG#nanami-anime-v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "$TAG" ]; then
            echo "::error::Invalid release tag '$TAG'. Expected nanami-anime-vX.Y.Z"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "NANAMI_ANIME_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "NANAMI_ANIME_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building Nanami Anime Release $VERSION_NAME from tag $TAG (code ${GITHUB_RUN_NUMBER})"

      - name: Prepare signing key
        env:
          MARU_STUDY_KEYSTORE_B64: ${{ secrets.MARU_STUDY_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${MARU_STUDY_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing MARU_STUDY_KEYSTORE_B64 repository secret."
            exit 1
          fi
          mkdir -p apps/manime/keystore
          KEYSTORE=apps/manime/keystore/nanami-anime-release.jks
          printf '%s' "$MARU_STUDY_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          cat > apps/manime/keystore.properties <<'EOF'
          storeFile=keystore/nanami-anime-release.jks
          storePassword=maru-study-release
          keyAlias=maru-study
          keyPassword=maru-study-release
          EOF
          echo "Configured permanent release keystore."

      - name: Test and build Nanami Anime release APK
        run: |
          chmod +x gradlew
          ./gradlew :apps:manime:testDebugUnitTest :apps:manime:assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=$(find apps/manime/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -f "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"

      - name: Stage release assets
        run: |
          mkdir -p out
          cp "$BUILT_APK" "out/nanami-anime-${NANAMI_ANIME_VERSION_NAME}.apk"
          sha256sum "out/nanami-anime-${NANAMI_ANIME_VERSION_NAME}.apk" > out/SHA256SUMS.txt
          ls -lh out
          cat out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanami-anime-${{ env.NANAMI_ANIME_VERSION_NAME }}
          path: out/*

      - name: Publish official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nanami Anime ${{ env.NANAMI_ANIME_VERSION_NAME }}
          prerelease: false
          make_latest: "true"
          files: |
            out/nanami-anime-${{ env.NANAMI_ANIME_VERSION_NAME }}.apk
            out/SHA256SUMS.txt
          body: |
            Official release for **Nanami Anime ${{ env.NANAMI_ANIME_VERSION_NAME }}**.

            ### What's Inside
            - **Crunchyroll-Styled Streaming & AniList Companion**: Full-bleed dark `#0B0C0F` + `#F47521` orange + `#2ABDBB` simulcast teal UI, wrapped titles, and `My Lists` with `Downloads` first, 6 sort modes, `Random` / `Random Dub` quick picks, and preserved split AniList Completed lists (`Completed TV`, `Completed Movie`, `Completed OVA`, etc.).
            - **Romanized Title Matching First**: Stream resolvers (`Stremio`/`Kitsu`, `Hstream`, `Sukebei`/`Nyaa`, `Cloudstream`, `Aniyomi`) prioritize Romanized `titleRomaji`, symbol-normalized variants, and synonyms ahead of localized Western/English titles. Dynamic `Hstream` slug + search resolution with sequel/edition guards and concurrent `Sukebei` fallback.
            - **Combined & Split Season Resolution**: Walks AniList `PREQUEL` series chains and translates between combined vs. split Kitsu/IMDb seasons (fixing mismatches like *Sailor Moon Crystal* Seasons 1–2 vs. Season 3) while filtering out mismatched season files.
            - **Custom Player & Remembered Speed**: 60fps Canvas seekbar, AniSkip OP/ED markers, brightness/volume vertical swipes, double-tap seek, Crunchyroll-style black subtitle fill + live subtitle size, persistent bottom progress bar, Chromecast casting, and **remembered playback speed** across episodes and sessions.
            - **Flexible Progress & NSFW Controls**: Configurable **Track watched at N%** threshold (default `80%`) with slider & presets, offline AniList sync queue, multi-account AniList switcher, **Do not track NSFW anime** toggle, separate NSFW tracking account selector, and guest mode.
            - **3-Tap Hentai Suggestions Pill**: Hidden whenever NSFW is disabled; placed at the very end of the empty-search category row and requires 3 consecutive taps to confirm NSFW anime suggestions.
            - **Private Offline Vault & Series Downloads**: Encrypted/hidden app-only `.nanami` + `.nomedia` storage with flexible **Download All Unwatched**, **Download Next 5 Episodes**, and custom episode stepper, **Allow Download with Cellular** guard, and zero-extra-storage **Seed My Download on WiFi** to keep rare/older anime alive for fellow viewers.
