name: Nanami Anime Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. nanami-anime-v2.1.1)"
        required: true
  push:
    tags:
      - "nanami-anime-v*"
      - "!*rotator*"

permissions:
  contents: write

concurrency:
  group: nanami-anime-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK" -name sdkmanager -type f | head -n 1)"
          echo "Using SDK at $SDK"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.1.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve release version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$TAG" =~ ^nanami-anime-v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
            echo "::error::Expected a stable tag in the form nanami-anime-vX.Y.Z"
            exit 1
          fi
          VERSION_NAME="${TAG#nanami-anime-v}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "NANAMI_ANIME_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          # Stable builds are one code above a rotator build from the same commit.
          VERSION_CODE=$((1001 + 2 * $(git rev-list --count HEAD)))
          echo "NANAMI_ANIME_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building Nanami Anime Release $VERSION_NAME from tag $TAG (code $VERSION_CODE)"

      - name: Prepare signing key
        env:
          MARU_STUDY_KEYSTORE_B64: ${{ secrets.MARU_STUDY_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${MARU_STUDY_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing MARU_STUDY_KEYSTORE_B64 repository secret."
            exit 1
          fi
          mkdir -p apps/manime/keystore
          KEYSTORE=apps/manime/keystore/nanami-anime-release.jks
          printf '%s' "$MARU_STUDY_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          cat > apps/manime/keystore.properties <<'EOF'
          storeFile=keystore/nanami-anime-release.jks
          storePassword=maru-study-release
          keyAlias=maru-study
          keyPassword=maru-study-release
          EOF
          echo "Configured permanent release keystore."

      - name: Test and build Nanami Anime release APK
        run: |
          chmod +x gradlew
          ./gradlew :apps:manime:testDebugUnitTest :apps:manime:assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=$(find apps/manime/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -f "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"

      - name: Stage release assets
        run: |
          mkdir -p out
          cp "$BUILT_APK" "out/nanami-anime-${NANAMI_ANIME_VERSION_NAME}.apk"
          (cd out && sha256sum "nanami-anime-${NANAMI_ANIME_VERSION_NAME}.apk" > SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["NANAMI_ANIME_VERSION_NAME"]
          apk = Path(f"out/nanami-anime-{version}.apk")
          metadata = {
              "versionName": version,
              "versionCode": int(os.environ["NANAMI_ANIME_VERSION_CODE"]),
              "sha256": Path("out/SHA256SUMS.txt").read_text().split()[0],
              "apkSize": apk.stat().st_size,
          }
          Path("out/update.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          ls -lh out
          cat out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanami-anime-${{ env.NANAMI_ANIME_VERSION_NAME }}
          path: out/*

      - name: Publish official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nanami Anime ${{ env.NANAMI_ANIME_VERSION_NAME }}
          prerelease: false
          make_latest: "false"
          files: |
            out/nanami-anime-${{ env.NANAMI_ANIME_VERSION_NAME }}.apk
            out/SHA256SUMS.txt
            out/update.json
          body_path: apps/manime/README.md

      - name: Prepare the stable download link
        id: stable_link
        run: |
          LATEST_TAG=$(git tag --list 'nanami-anime-v*' --sort=-version:refname |
            awk '/^nanami-anime-v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          if [ "$LATEST_TAG" = "$RELEASE_TAG" ]; then
            mkdir -p stable
            cp "out/nanami-anime-${NANAMI_ANIME_VERSION_NAME}.apk" stable/nanami-anime-stable.apk
            (cd stable && sha256sum nanami-anime-stable.apk > SHA256SUMS.txt)
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the Nanami Anime stable APK link
        if: steps.stable_link.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nanami-anime-stable
          target_commitish: ${{ github.sha }}
          name: Nanami Anime Stable Download
          prerelease: true
          make_latest: "false"
          files: |
            stable/nanami-anime-stable.apk
            stable/SHA256SUMS.txt
          body: |
            Stable APK link for the Maru website. Current version: ${{ env.NANAMI_ANIME_VERSION_NAME }}.
            [Release details](https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }})
