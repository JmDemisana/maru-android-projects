name: Nanami Anime Rotator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/manime/**"
      - ".github/workflows/nanami-anime-rotator.yml"

permissions:
  contents: write

concurrency:
  group: nanami-anime-rotator
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the rolling tag
        run: |
          if git show-ref --verify --quiet refs/tags/nanami-anime-rotator &&
             ! git merge-base --is-ancestor refs/tags/nanami-anime-rotator HEAD; then
            echo "::error::This run is older than the published Rotator. Run the workflow from main."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK" -name sdkmanager -type f | head -n 1)"
          echo "Using SDK at $SDK"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.1.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve rotator version
        run: |
          set -euo pipefail
          BASE_VERSION=$(git tag --merged HEAD --list 'nanami-anime-v*' --sort=-version:refname |
            awk '/^nanami-anime-v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { sub(/^nanami-anime-v/, ""); print; found=1 }')
          IFS=. read -r major minor patch <<< "${BASE_VERSION:-2.1.1}"
          VERSION_NAME="$major.$minor.$((10#$patch + 1))-rotator.$GITHUB_RUN_NUMBER"
          echo "NANAMI_ANIME_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          VERSION_CODE=$((1000 + 2 * $(git rev-list --count HEAD)))
          echo "NANAMI_ANIME_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building Nanami Anime Rotator $VERSION_NAME (code $VERSION_CODE)"

      - name: Prepare signing key
        env:
          MARU_STUDY_KEYSTORE_B64: ${{ secrets.MARU_STUDY_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${MARU_STUDY_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing MARU_STUDY_KEYSTORE_B64 repository secret."
            exit 1
          fi
          mkdir -p apps/manime/keystore
          KEYSTORE=apps/manime/keystore/nanami-anime-release.jks
          printf '%s' "$MARU_STUDY_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          cat > apps/manime/keystore.properties <<'EOF'
          storeFile=keystore/nanami-anime-release.jks
          storePassword=maru-study-release
          keyAlias=maru-study
          keyPassword=maru-study-release
          EOF

      - name: Test and build Nanami Anime rotator APK
        run: |
          chmod +x gradlew
          ./gradlew :apps:manime:testDebugUnitTest :apps:manime:assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=$(find apps/manime/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -f "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"

      - name: Stage APK
        run: |
          mkdir -p out
          cp "$BUILT_APK" out/nanami-anime-rotator.apk
          (cd out && sha256sum nanami-anime-rotator.apk > SHA256SUMS.txt)
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanami-anime-rotator-${{ env.NANAMI_ANIME_VERSION_NAME }}
          path: out/*

      - name: Update the rolling Rotator prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nanami-anime-rotator
          target_commitish: ${{ github.sha }}
          name: Nanami Anime Rotator (${{ env.NANAMI_ANIME_VERSION_NAME }})
          draft: false
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            out/nanami-anime-rotator.apk
            out/SHA256SUMS.txt
          body: |
            Rolling development build for **Nanami Anime** (`${{ env.NANAMI_ANIME_VERSION_NAME }}`).

            [GitHub Actions run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) built and tested commit `${{ github.sha }}`.
            Once verified on a device, use that run ID in **Nanami Anime Completer** to publish a stable version.

            [Latest stable build](https://github.com/${{ github.repository }}/releases/tag/nanami-anime-latest)

      - name: Point the rolling tag at the published commit
        run: git push origin "+HEAD:refs/tags/nanami-anime-rotator"
