name: Maru Study Release

on:
  workflow_dispatch:
  push:
    tags:
      - "maru-study-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK" -name sdkmanager -type f | head -n 1)"
          echo "Using SDK at $SDK"
          echo "Using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.1.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#maru-study-v}"
          if [ "$VERSION_NAME" = "main" ] || [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "MARU_STUDY_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MARU_STUDY_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building $VERSION_NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Cache release keystore
        uses: actions/cache@v4
        with:
          path: apps/maru-study/keystore/maru-study-release.jks
          key: maru-study-release-keystore-v1

      - name: Prepare signing key
        run: |
          mkdir -p apps/maru-study/keystore
          KEYSTORE=apps/maru-study/keystore/maru-study-release.jks
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias maru-study \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass maru-study-release -keypass maru-study-release \
              -dname "CN=Maru Study, OU=Maru, O=Maru, L=Manila, ST=Metro Manila, C=PH"
          fi
          cat > apps/maru-study/keystore.properties <<'EOF'
          storeFile=keystore/maru-study-release.jks
          storePassword=maru-study-release
          keyAlias=maru-study
          keyPassword=maru-study-release
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :apps:maru-study:assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK="apps/maru-study/build/outputs/apk/release/maru-study-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Stage APK
        run: |
          mkdir -p out
          cp apps/maru-study/build/outputs/apk/release/maru-study-release.apk \
             "out/maru-study-${MARU_STUDY_VERSION_NAME}.apk"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maru-study-${{ env.MARU_STUDY_VERSION_NAME }}
          path: out/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Maru Study ${{ env.MARU_STUDY_VERSION_NAME }}
          files: out/*.apk
          body: |
            Maru Study, fresh and blank. No subjects, classes, or homework are bundled.

            What's inside:
            - Schedule with grid and list views
            - TUP Grade Solver with PNG reports
            - Homework with reminders
            - Nanami AI (full-screen site)

            Install the APK to sideload. Android may ask you to allow installs from your browser or file manager.
