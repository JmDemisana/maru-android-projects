[versions]
agp                         = "9.3.1"
kotlin                      = "2.2.10"
ksp                         = "2.3.6"
hilt                        = "2.51.1"

androidx-core-ktx           = "1.17.0"
androidx-appcompat          = "1.7.1"
androidx-activity-compose   = "1.9.0"
androidx-lifecycle          = "2.8.1"
androidx-navigation-compose = "2.8.0"
androidx-room               = "2.6.1"
androidx-datastore          = "1.1.1"
androidx-webkit             = "1.14.0"
androidx-security-crypto    = "1.1.0-alpha06"
androidx-camera             = "1.4.1"
androidx-media              = "1.7.0"
androidx-work               = "2.10.2"
media3                      = "1.4.1"
libtorrent4j                = "2.1.0-32"

compose-bom                 = "2024.09.00"
material                    = "1.14.0"

okhttp                      = "4.12.0"
gson                        = "2.10.1"
jsoup                       = "1.18.1"
coroutines                  = "1.8.1"
coil                        = "2.7.0"

mlkit-barcode               = "17.3.0"
tensorflow-lite             = "2.16.1"
zxing-android               = "4.3.0"
firebase-bom                = "34.16.0"

junit                       = "4.13.2"
androidx-junit              = "1.2.1"
androidx-espresso           = "3.6.1"

[libraries]
coil-compose                = { group = "io.coil-kt",          name = "coil-compose",          version.ref = "coil" }
androidx-core-ktx           = { group = "androidx.core",       name = "core-ktx",              version.ref = "androidx-core-ktx" }
androidx-appcompat          = { group = "androidx.appcompat",  name = "appcompat",              version.ref = "androidx-appcompat" }
androidx-activity-compose   = { group = "androidx.activity",   name = "activity-compose",       version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",  version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-service  = { group = "androidx.lifecycle",  name = "lifecycle-service",      version.ref = "androidx-lifecycle" }
androidx-webkit             = { group = "androidx.webkit",     name = "webkit",                 version.ref = "androidx-webkit" }
androidx-media              = { group = "androidx.media",      name = "media",                  version.ref = "androidx-media" }

compose-bom                 = { group = "androidx.compose",    name = "compose-bom",            version.ref = "compose-bom" }
compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended      = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose",     version.ref = "androidx-navigation-compose" }
androidx-room-runtime       = { group = "androidx.room",       name = "room-runtime",           version.ref = "androidx-room" }
androidx-room-ktx           = { group = "androidx.room",       name = "room-ktx",               version.ref = "androidx-room" }
androidx-room-compiler      = { group = "androidx.room",       name = "room-compiler",          version.ref = "androidx-room" }
androidx-datastore-prefs    = { group = "androidx.datastore",  name = "datastore-preferences",  version.ref = "androidx-datastore" }
androidx-camera-core        = { group = "androidx.camera",     name = "camera-core",            version.ref = "androidx-camera" }
androidx-camera-camera2     = { group = "androidx.camera",     name = "camera-camera2",         version.ref = "androidx-camera" }
androidx-camera-lifecycle   = { group = "androidx.camera",     name = "camera-lifecycle",       version.ref = "androidx-camera" }
androidx-camera-view        = { group = "androidx.camera",     name = "camera-view",            version.ref = "androidx-camera" }

okhttp                      = { group = "com.squareup.okhttp3", name = "okhttp",               version.ref = "okhttp" }
gson                        = { group = "com.google.code.gson", name = "gson",                 version.ref = "gson" }
jsoup                       = { group = "org.jsoup",            name = "jsoup",                 version.ref = "jsoup" }
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
material-mdc                = { group = "com.google.android.material", name = "material",       version.ref = "material" }
mlkit-barcode               = { group = "com.google.mlkit",    name = "barcode-scanning",      version.ref = "mlkit-barcode" }
hilt-android                = { group = "com.google.dagger",    name = "hilt-android",          version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",    name = "hilt-android-compiler", version.ref = "hilt" }

junit                       = { group = "junit",               name = "junit",                 version.ref = "junit" }
androidx-junit              = { group = "androidx.test.ext",   name = "junit",                 version.ref = "androidx-junit" }
androidx-espresso-core      = { group = "androidx.test.espresso", name = "espresso-core",      version.ref = "androidx-espresso" }

# Build logic dependencies
android-gradlePlugin        = { group = "com.android.tools.build", name = "gradle",            version.ref = "agp" }
kotlin-gradlePlugin         = { group = "org.jetbrains.kotlin",    name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# Media3 / ExoPlayer
media3-exoplayer            = { group = "androidx.media3", name = "media3-exoplayer",      version.ref = "media3" }
media3-exoplayer-hls        = { group = "androidx.media3", name = "media3-exoplayer-hls",  version.ref = "media3" }
media3-exoplayer-dash       = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-ui                   = { group = "androidx.media3", name = "media3-ui",             version.ref = "media3" }
media3-session              = { group = "androidx.media3", name = "media3-session",         version.ref = "media3" }

# Torrent
libtorrent4j                = { group = "org.libtorrent4j", name = "libtorrent4j-android-arm64", version.ref = "libtorrent4j" }


[plugins]
android-application         = { id = "com.android.application",             version.ref = "agp" }
android-library             = { id = "com.android.library",                 version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                         = { id = "com.google.devtools.ksp",             version.ref = "ksp" }

[bundles]
compose-core = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3"]
lifecycle    = ["androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel"]
camera       = ["androidx-camera-core", "androidx-camera-camera2", "androidx-camera-lifecycle", "androidx-camera-view"]
room         = ["androidx-room-runtime", "androidx-room-ktx"]
network      = ["okhttp", "gson"]
testing      = ["junit", "androidx-junit", "androidx-espresso-core"]
media3       = ["media3-exoplayer", "media3-exoplayer-hls", "media3-exoplayer-dash", "media3-ui", "media3-session"]

